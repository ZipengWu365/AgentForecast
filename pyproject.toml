[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforecast"
version = "1.8.0"
description = "A reviewed forecast-to-publish layer for time-series forecasting across heterogeneous backends."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Zipeng Wu", email = "zxw365@student.bham.ac.uk"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "matplotlib>=3.6"
]
keywords = ["forecasting", "time-series", "agent", "river", "xgboost", "arima", "mlforecast", "statsforecast"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
stats = [
  "statsmodels>=0.14",
  "statsforecast"
]
ml = [
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "catboost>=1.2",
  "mlforecast"
]
stream = [
  "river>=0.23"
]
features = [
  "tsfresh>=0.21"
]
deep = [
  "neuralforecast"
]
automl = [
  "autogluon.timeseries"
]
tabpfn = [
  "tabpfn"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]
docs = [
  "pytest>=8.0"
]
all = [
  "statsmodels>=0.14",
  "statsforecast",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "catboost>=1.2",
  "mlforecast",
  "river>=0.23",
  "tsfresh>=0.21",
  "neuralforecast",
  "autogluon.timeseries",
  "tabpfn",
  "pytest>=8.0",
  "pytest-cov>=5.0"
]

[project.scripts]
agentforecast = "agentforecast.cli:main"

[project.urls]
"Homepage" = "https://zipengwu365.github.io/AgentForecast/"
"Repository" = "https://github.com/ZipengWu365/AgentForecast"
"Documentation" = "https://zipengwu365.github.io/AgentForecast/"
"Gallery" = "https://zipengwu365.github.io/AgentForecast/gallery/"
"Paper" = "https://zipengwu365.github.io/AgentForecast/papers/jmlr-mloss/"
"Issues" = "https://github.com/ZipengWu365/AgentForecast/issues"
"Changelog" = "https://github.com/ZipengWu365/AgentForecast/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["agentforecast*"]

[tool.setuptools.package-data]
agentforecast = [
  "package_data/datasets/*.csv",
  "package_data/public_examples/*.csv",
  "package_data/manifests/*.json",
  "package_data/schemas/*.json",
  "package_data/benchmarks/*.csv"
]


[tool.setuptools.dynamic]

[tool.agentforecast.release]
requires_public_urls = true
release_profile = "release/HOSTED_PROFILE.template.toml"
notes = "Fill real repo/docs/gallery URLs before public release instead of publishing fake metadata."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=agentforecast --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=60"
markers = [
  "optional: tests for optional adapters and extras",
  "slow: slower integration or site-generation tests"
]
