name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python -m pytest -m "not optional and not slow"
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install .[dev,stats,ml,stream]
      - run: python -m pytest -q
      - run: python -m build --wheel
      - run: python scripts/smoke_test_wheel.py
      - run: python scripts/build_benchmarks.py
      - run: python scripts/build_demo_gallery.py
      - run: python scripts/build_gallery_preview.py
      - run: python scripts/validate_v1_9.py
