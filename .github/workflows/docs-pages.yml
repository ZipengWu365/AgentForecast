name: docs-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/configure-pages@v5
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev,stats,ml,stream]
      - run: python scripts/build_benchmarks.py
      - run: python scripts/build_demo_gallery.py
      - run: python scripts/build_gallery_preview.py
      - run: python scripts/validate_v1_9.py
      - name: Disable Jekyll processing
        shell: pwsh
        run: New-Item -ItemType File -Path public_gallery/site/.nojekyll -Force
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_gallery/site
      - id: deployment
        uses: actions/deploy-pages@v4
