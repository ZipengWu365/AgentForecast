name: publish-gallery

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/configure-pages@v5
      - run: python -m pip install .[stats,ml]
      - run: python -m pip wheel . -w dist --no-deps
      - run: python scripts/smoke_test_wheel.py
      - run: python scripts/build_benchmarks.py
      - run: python scripts/build_demo_gallery.py
      - run: python scripts/build_gallery_preview.py
      - run: python scripts/validate_v1_7.py
      - name: Disable Jekyll processing
        run: New-Item -ItemType File -Path public_gallery/site/.nojekyll -Force
        shell: pwsh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_gallery/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
