name: optional-adapters

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reviewed-candidates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        candidate:
          - extra: ml
            tests: "tests/test_reviewed_mlforecast.py tests/test_backends_optional.py -m optional"
          - extra: stream
            tests: "tests/test_reviewed_river.py tests/test_streaming_pilot.py tests/test_backends_optional.py -m optional"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev,${{ matrix.candidate.extra }}]
      - run: python -m pytest ${{ matrix.candidate.tests }}
